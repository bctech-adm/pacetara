name: pacetara
description: Aplikasi komunitas lari Indonesia.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.2.0
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  crypto: ^3.0.8
  open_filex: ^5.0.0
  path_provider: ^2.1.5
  geolocator: ^14.1.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/certs/
