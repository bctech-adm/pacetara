name: pacetara
description: Aplikasi komunitas lari Indonesia.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  google_sign_in: ^7.2.0
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  crypto: ^3.0.8
  open_filex: ^5.0.0
  path_provider: ^2.1.5
  geolocator: ^14.1.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  shared_preferences: ^2.5.6
  # 13.x memakai permission_handler_android 14 yang mewajibkan compileSdk 37 (belum didukung AGP saat ini).
  permission_handler: ^12.0.3
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  share_plus: ^13.3.1
  # Health Connect (modul 2.3). Butuh minSdk 26 dan MainActivity FlutterFragmentActivity.
  health: ^13.3.2
  # Google Play Billing (modul 2.5). Paket resmi; status langganan tetap diputuskan server.
  in_app_purchase: ^3.2.3
  in_app_purchase_android: ^0.4.0
  # Absensi QR (modul 2.6): tampilan QR murni Dart, dan pemindai kamera (CameraX + ML Kit). Izin CAMERA hanya
  # diminta saat membuka pemindai.
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.0
  # Iklan AdMob (modul 2.7), paket resmi Google. Hanya banner/native di feed dan daftar event untuk pengguna gratis;
  # SDK baru diinisialisasi saat slot iklan pertama tampil. ID aplikasi masuk manifest lewat Gradle.
  google_mobile_ads: ^9.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/certs/
    - assets/strava/
