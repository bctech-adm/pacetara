# Penyaji file statis panel admin. Berjalan sebagai user `nginx` (non-root) di port 8080.
# TLS, log akses, CrowdSec, dan batas laju ada di reverse proxy (Traefik/Caddy) di depannya.
worker_processes 1;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log off;
  sendfile on;

  client_body_temp_path /tmp/nginx/body;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    root /srv;

    # headers.conf dibuat entrypoint.sh (CSP memuat URL API dari environment).
    # add_header di dalam location menimpa yang di atasnya, jadi setiap location meng-include ulang.
    include /tmp/nginx/headers.conf;

    location = /config.js {
      alias /tmp/nginx/config.js;
      default_type application/javascript;
      include /tmp/nginx/headers.conf;
      add_header Cache-Control "no-store" always;
    }

    location /assets/ {
      include /tmp/nginx/headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
      try_files $uri /index.html;
    }
  }
}
