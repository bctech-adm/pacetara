# Situs publik pace.bimacreative.tech (beranda, kebijakan privasi, kebijakan transaksi).
# Non-root di port 8080; TLS dan log akses ada di reverse proxy di depannya.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log off;
  sendfile on;
  charset utf-8;

  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  server {
    listen 8080;
    root /srv;
    index index.html;
    absolute_redirect off;

    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
      try_files $uri $uri/ =404;
    }

    # app-ads.txt AdMob (modul 2.7), dibuat entrypoint dari ADMOB_PUBLISHER_ID; 404 selama belum diisi.
    location = /app-ads.txt {
      root /tmp/app-ads;
      default_type text/plain;
      add_header X-Content-Type-Options nosniff always;
      add_header Cache-Control "public, max-age=3600" always;
      try_files /app-ads.txt =404;
    }

    # Tautan undangan komunitas: /j/KODE. Kode dibatasi regex (8 huruf/angka), jadi aman disisipkan.
    # Saat App Links Android aktif, tautan ini langsung membuka aplikasi; halaman ini cadangannya.
    location ~ "^/j/([A-Za-z2-9]{8})$" {
      default_type text/html;
      add_header Content-Security-Policy "default-src 'none'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header Cache-Control "no-store" always;
      return 200 '<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Undangan komunitas PaceTara</title><link rel="stylesheet" href="/styles.css"></head><body><main class="wrap"><section class="hero"><h1>Kamu diundang ke komunitas lari di PaceTara</h1><p>Buka aplikasi PaceTara, pilih <strong>+ Komunitas</strong> lalu <strong>Gabung dengan kode undangan</strong>, dan masukkan kode ini:</p><p class="invite-code">$1</p><div class="links"><a href="/">Tentang PaceTara</a><a href="/privasi">Kebijakan Privasi</a></div></section></main></body></html>';
    }
  }
}
