# Override untuk VPS bersama (Hostinger) yang sudah punya Traefik di 80/443.
#   docker compose -f docker-compose.yml -f docker-compose.vps.yml up -d
# Caddy tidak dijalankan; Traefik meneruskan domain ke container lewat network `web-edge`
# (rute: infra/traefik/pacetara.yml → /opt/infra/traefik/dynamic/clients/).
# Di VPS khusus nanti, cukup jalankan docker-compose.yml saja (Caddy aktif lagi).

x-limits: &logging
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  caddy:
    profiles: ["caddy"]   # nonaktif di VPS bersama

  api:
    container_name: pacetara-api
    <<: *logging
    networks: [internal, edge, web-edge]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    cap_drop: [ALL]

  admin:
    container_name: pacetara-admin
    <<: *logging
    networks: [internal, web-edge]
    mem_limit: 64m
    cpus: 0.25

  web:
    container_name: pacetara-web
    <<: *logging
    networks: [internal, web-edge]
    mem_limit: 32m
    cpus: 0.25

  worker:
    container_name: pacetara-worker
    <<: *logging
    mem_limit: 512m
    cpus: 0.5
    cap_drop: [ALL]

  migrate:
    container_name: pacetara-migrate
    <<: *logging

  wa-otp:
    container_name: pacetara-wa-otp
    <<: *logging
    mem_limit: 384m
    cpus: 0.5

  postgres:
    container_name: pacetara-postgres
    <<: *logging
    mem_limit: 1g

  redis:
    container_name: pacetara-redis
    <<: *logging
    mem_limit: 256m

  s3:
    container_name: pacetara-s3
    <<: *logging
    mem_limit: 512m

  backup:
    container_name: pacetara-backup
    <<: *logging
    mem_limit: 256m

  # Deploy otomatis berbasis tarik (infra/deployer/deploy-loop.sh). Memegang docker.sock (setara
  # akses root ke Docker), jadi: image resmi `docker` dengan versi terkunci, tanpa jaringan sendiri
  # (penarikan image dilakukan daemon Docker), dan berkas stack dipasang read-only.
  # Path harus sama dengan di host karena bind mount Compose di-resolve oleh daemon di host.
  deployer:
    image: docker:29.9.3-cli
    container_name: pacetara-deployer
    restart: unless-stopped
    network_mode: none
    environment:
      STACK_DIR: /opt/infra/web/clients/pacetara
      INTERVAL: "300"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/infra/web/clients/pacetara:/opt/infra/web/clients/pacetara:ro
    entrypoint: ["/bin/sh", "/opt/infra/web/clients/pacetara/infra/deployer/deploy-loop.sh"]
    <<: *logging
    mem_limit: 128m
    security_opt: ["no-new-privileges:true"]

networks:
  web-edge:
    external: true
    name: web-edge
