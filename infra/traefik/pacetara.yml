# PaceTara API pace-api.bimacreative.tech → container `pacetara-api:3000` (network web-edge).
# Stack: /opt/infra/web/clients/pacetara. Pasang: salin ke /opt/infra/traefik/dynamic/clients/, lalu
# `docker exec traefik kill -HUP 1` (JANGAN `docker kill`).
# DNS pre-check WAJIB: dig +short A pace-api.bimacreative.tech @1.1.1.1 & @8.8.8.8 = 31.97.50.221, AAAA kosong.
# Urutan middleware = konvensi router lain: crowdsec → security-headers → ratelimit-*.
# Panel admin: pace-admin.bimacreative.tech → pacetara-admin:8080.
http:
  routers:
    # Login/daftar/OTP: batas ketat terhadap brute-force dan spam OTP (API juga membatasi sendiri).
    pacetara-api-auth:
      entryPoints: [websecure]
      rule: "Host(`pace-api.bimacreative.tech`) && Method(`POST`) && PathPrefix(`/v1/auth/`)"
      priority: 100
      middlewares: [crowdsec, security-headers, pacetara-ratelimit-auth, pacetara-body-limit]
      service: pacetara-api
      tls:
        certResolver: le-http
    pacetara-api:
      entryPoints: [websecure]
      rule: "Host(`pace-api.bimacreative.tech`)"
      priority: 1
      middlewares: [crowdsec, security-headers, ratelimit-default, pacetara-body-limit]
      service: pacetara-api
      tls:
        certResolver: le-http
    # Panel super admin (login + 2FA dibangun di modul 1.8). CSP diatur container admin sendiri.
    pacetara-admin:
      entryPoints: [websecure]
      rule: "Host(`pace-admin.bimacreative.tech`)"
      priority: 1
      middlewares: [crowdsec, security-headers, ratelimit-default]
      service: pacetara-admin
      tls:
        certResolver: le-http

  middlewares:
    # Batas ukuran body di tepi (sama dengan Caddyfile lokal): unggahan terbesar 8 MB + overhead multipart.
    # API juga membatasi sendiri (JSON 1 MB, file 8 MB, field multipart); ini lapisan pertama.
    pacetara-body-limit:
      buffering:
        maxRequestBodyBytes: 15000000
        memRequestBodyBytes: 2000000
    # 10 req/menit per IP, burst 10 (pengguna seluler di balik NAT bisa berbagi IP).
    pacetara-ratelimit-auth:
      rateLimit:
        average: 10
        period: 1m
        burst: 10

  services:
    pacetara-api:
      loadBalancer:
        servers:
          - url: "http://pacetara-api:3000"
        healthCheck:
          path: /health/live
          interval: 15s
          timeout: 3s
    pacetara-admin:
      loadBalancer:
        servers:
          - url: "http://pacetara-admin:8080"
