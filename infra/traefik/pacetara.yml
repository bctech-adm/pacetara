# PaceTara API pace-api.bimacreative.tech → container `pacetara-api:3000` (network web-edge).
# Stack: /opt/infra/web/clients/pacetara. Pasang: salin ke /opt/infra/traefik/dynamic/clients/, lalu
# `docker exec traefik kill -HUP 1` (JANGAN `docker kill`).
# DNS pre-check WAJIB: dig +short A pace-api.bimacreative.tech @1.1.1.1 & @8.8.8.8 = 31.97.50.221, AAAA kosong.
# Urutan middleware = konvensi router lain: crowdsec → security-headers → ratelimit-*.
# WAF AppSec dimatikan untuk PaceTara (keputusan pemilik 2026-11-11): `crowdsec-ban-only` = ban IP tetap, AppSec
# tidak (middleware didefinisikan di Traefik VPS: middlewares/crowdsec-ban-only.yml).
# Panel admin: pace-admin.bimacreative.tech → pacetara-admin:8080.
http:
  routers:
    # Login/daftar/OTP: batas ketat terhadap brute-force dan spam OTP (API juga membatasi sendiri).
    pacetara-api-auth:
      entryPoints: [websecure]
      rule: "Host(`pace-api.bimacreative.tech`) && Method(`POST`) && PathPrefix(`/v1/auth/`)"
      priority: 100
      middlewares: [crowdsec-ban-only, security-headers, pacetara-ratelimit-auth, pacetara-body-limit]
      service: pacetara-api
      tls:
        certResolver: le-http
    # Tile peta sendiri (KEPUTUSAN #315) → pacetara-tiles:8080. Satu layar peta memuat puluhan tile sekaligus,
    # jadi batas lajunya sendiri (lebih longgar dari ratelimit-default) dan tanpa batas body (hanya GET).
    pacetara-tiles:
      entryPoints: [websecure]
      rule: "Host(`pace-api.bimacreative.tech`) && PathPrefix(`/tiles/`) && Method(`GET`, `HEAD`)"
      priority: 50
      middlewares: [crowdsec-ban-only, security-headers, pacetara-ratelimit-tiles, pacetara-tiles-strip, pacetara-tiles-cache]
      service: pacetara-tiles
      tls:
        certResolver: le-http
    pacetara-api:
      entryPoints: [websecure]
      rule: "Host(`pace-api.bimacreative.tech`)"
      priority: 1
      middlewares: [crowdsec-ban-only, security-headers, ratelimit-default, pacetara-body-limit]
      service: pacetara-api
      tls:
        certResolver: le-http
    # Panel super admin (login + 2FA dibangun di modul 1.8). CSP diatur container admin sendiri.
    pacetara-admin:
      entryPoints: [websecure]
      rule: "Host(`pace-admin.bimacreative.tech`)"
      priority: 1
      middlewares: [crowdsec-ban-only, security-headers, ratelimit-default]
      service: pacetara-admin
      tls:
        certResolver: le-http

  middlewares:
    # Batas ukuran body di tepi (sama dengan Caddyfile lokal): unggahan terbesar 8 MB + overhead multipart.
    # API juga membatasi sendiri (JSON 1 MB, file 8 MB, field multipart); ini lapisan pertama.
    # memRequestBodyBytes = maxRequestBodyBytes: body di atas batas memori ditulis Traefik ke berkas sementara,
    # padahal foto KTP/selfie tidak boleh menyentuh disk (KEPUTUSAN #316).
    pacetara-body-limit:
      buffering:
        maxRequestBodyBytes: 15000000
        memRequestBodyBytes: 15000000
    # 10 req/menit per IP, burst 10 (pengguna seluler di balik NAT bisa berbagi IP).
    pacetara-ratelimit-auth:
      rateLimit:
        average: 10
        period: 1m
        burst: 10

    # 20 tile/detik per IP, burst 200 (membuka peta / menggeser cepat).
    pacetara-ratelimit-tiles:
      rateLimit:
        average: 20
        period: 1s
        burst: 200
    pacetara-tiles-strip:
      stripPrefix:
        prefixes: ["/tiles"]
    pacetara-tiles-cache:
      headers:
        customResponseHeaders:
          Cache-Control: "public, max-age=604800"

  services:
    pacetara-api:
      loadBalancer:
        servers:
          - url: "http://pacetara-api:3000"
        healthCheck:
          path: /health/live
          interval: 15s
          timeout: 3s
    pacetara-admin:
      loadBalancer:
        servers:
          - url: "http://pacetara-admin:8080"
    pacetara-tiles:
      loadBalancer:
        servers:
          - url: "http://pacetara-tiles:8080"
