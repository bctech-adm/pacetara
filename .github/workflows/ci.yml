name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Pindai rahasia (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  node:
    name: ${{ matrix.pkg }} — lint, tes, audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [backend, wa-otp, admin]
    defaults:
      run:
        working-directory: ${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.pkg }}/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test --if-present
      - run: npm run build
      - name: Audit dependensi produksi
        run: npm audit --omit=dev --audit-level=high

  migrations:
    name: Migrasi di PostGIS bersih
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ci" --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Migrasi dua kali (harus idempoten)
        run: npm run migrate && npm run migrate

  compose:
    name: Validasi docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config -q

  images:
    name: Build, pindai, dan push image
    needs: [secrets, node, migrations, compose]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
          - name: wa-otp
            context: wa-otp
          - name: admin
            context: admin
          - name: backup
            context: infra/backup
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Nama image (huruf kecil)
        id: img
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pacetara-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ steps.img.outputs.ref }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Pindai celah (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ steps.img.outputs.ref }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Login GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name == 'push'
        run: |
          REF=${{ steps.img.outputs.ref }}
          docker tag $REF:ci $REF:${GITHUB_SHA::12}
          docker push $REF:${GITHUB_SHA::12}
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then docker tag $REF:ci $REF:latest && docker push $REF:latest; fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then docker tag $REF:ci $REF:${GITHUB_REF_NAME} && docker push $REF:${GITHUB_REF_NAME}; fi

  mobile:
    name: Flutter — analisis dan tes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
