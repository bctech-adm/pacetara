name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Tombol "Run workflow" di tab Actions (mis. menerbitkan APK setelah secrets diisi).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Pindai rahasia (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # CLI langsung atas seluruh riwayat (gitleaks-action gagal pada push pertama ke repo kosong).
      - name: gitleaks (seluruh riwayat git)
        run: |
          docker run --rm -v "$PWD:/repo" --entrypoint sh ghcr.io/gitleaks/gitleaks:v8.24.3 -c \
            'git config --global --add safe.directory /repo && gitleaks git /repo --redact -v --exit-code 1'

  node:
    name: ${{ matrix.pkg }} — lint, tes, audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [backend, wa-otp, admin]
    defaults:
      run:
        working-directory: ${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.pkg }}/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test --if-present
      - run: npm run build
      - name: Audit dependensi produksi
        run: npm audit --omit=dev --audit-level=high

  migrations:
    name: Migrasi + tes e2e (PostGIS, Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U ci" --health-interval 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Migrasi dua kali (harus idempoten)
        run: npm run migrate && npm run migrate
      - name: Tes e2e
        run: npm test

  compose:
    name: Validasi docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env && docker compose config -q

  images:
    name: Build, pindai, dan push image
    needs: [secrets, node, migrations, compose]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
          - name: wa-otp
            context: wa-otp
          - name: admin
            context: admin
          - name: backup
            context: infra/backup
          - name: web
            context: web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Nama image (huruf kecil)
        id: img
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pacetara-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ steps.img.outputs.ref }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Pindai celah (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.img.outputs.ref }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Login GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        if: github.event_name != 'pull_request'
        run: |
          REF=${{ steps.img.outputs.ref }}
          docker tag $REF:ci $REF:${GITHUB_SHA::12}
          docker push $REF:${GITHUB_SHA::12}
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then docker tag $REF:ci $REF:${GITHUB_REF_NAME} && docker push $REF:${GITHUB_REF_NAME}; fi

  # Tag `latest` hanya dipasang setelah SEMUA image lolos tes dan Trivy, agar deployer di VPS
  # (yang memantau `latest`) tidak pernah menarik campuran versi lama dan baru.
  promote:
    name: Tandai image sebagai latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [images, mobile]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag ke latest
        run: |
          OWNER=${GITHUB_REPOSITORY_OWNER,,}
          for n in backend wa-otp admin backup web; do
            REF=ghcr.io/$OWNER/pacetara-$n
            docker buildx imagetools create -t $REF:latest $REF:${GITHUB_SHA::12}
          done

  # APK uji bertanda tangan → GitHub Release + latest.json. Aplikasi membaca versi terbaru lewat
  # GET /v1/app/android/latest lalu menawarkan pembaruan.
  android:
    name: Build dan terbitkan APK
    needs: [mobile, node, migrations]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: mobile
    env:
      API_BASE_URL: https://pace-api.bimacreative.tech
      # Client ID OAuth tipe Web (bukan rahasia; juga ada di GOOGLE_CLIENT_IDS server).
      GOOGLE_SERVER_CLIENT_ID: 189767025620-acehdrg0uq4a359iofr1tel7ssdsiimf.apps.googleusercontent.com
      # Konfigurasi aplikasi Firebase untuk push (bukan rahasia; ikut di setiap APK). Variabel repo
      # Settings → Variables; kosong = APK tanpa push (notifikasi di dalam aplikasi tetap jalan).
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      FIREBASE_APP_ID: ${{ vars.FIREBASE_APP_ID }}
      FIREBASE_SENDER_ID: ${{ vars.FIREBASE_SENDER_ID }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Siapkan kunci tanda tangan
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.PACETARA_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PACETARA_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "Secret PACETARA_KEYSTORE_B64 belum diatur: APK dibangun untuk verifikasi saja, tidak diterbitkan."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "PACETARA_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks"
            echo "PACETARA_KEY_ALIAS=pacetara"
            echo "PACETARA_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "PACETARA_KEY_PASSWORD=$KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"
      - run: flutter pub get
      - name: Build APK
        run: |
          # versionCode harus selalu naik agar bisa dipasang menimpa versi lama.
          CODE=$((100 + GITHUB_RUN_NUMBER))
          echo "CODE=$CODE" >> "$GITHUB_ENV"
          flutter build apk --release --build-number=$CODE --build-name=0.1.$CODE \
            --dart-define=API_BASE_URL=$API_BASE_URL --dart-define=GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID             --dart-define=FIREBASE_API_KEY=$FIREBASE_API_KEY --dart-define=FIREBASE_APP_ID=$FIREBASE_APP_ID             --dart-define=FIREBASE_SENDER_ID=$FIREBASE_SENDER_ID --dart-define=FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID
          cp build/app/outputs/flutter-apk/app-release.apk "$RUNNER_TEMP/pacetara-$CODE.apk"
      - name: Terbitkan rilis
        if: steps.signing.outputs.signed == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK="$RUNNER_TEMP/pacetara-$CODE.apk"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APK")
          NOTES=$(git log -1 --pretty=%s | head -c 500)
          TAG="android-$CODE"
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/pacetara-$CODE.apk"
          jq -n --argjson code "$CODE" --arg name "0.1.$CODE" --arg url "$URL" --arg sha "$SHA" \
            --argjson size "$SIZE" --arg notes "$NOTES" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{versionCode:$code, versionName:$name, apkUrl:$url, sha256:$sha, sizeBytes:$size, notes:$notes, publishedAt:$at}' \
            > "$RUNNER_TEMP/latest.json"
          gh release create "$TAG" "$APK" "$RUNNER_TEMP/latest.json" --latest \
            --title "PaceTara 0.1.$CODE (uji)" --notes "$NOTES" --target "$GITHUB_SHA"
      - name: Hapus kunci dari runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

  mobile:
    name: Flutter — analisis dan tes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
